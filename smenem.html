<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckpointVG: Presentando Super Menem Bros</title>
    
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    
    <style>
        /* --- Reset y Estilos Globales --- */
        @font-face {
            font-family: 'Airone'; /* El nombre que le daremos para usarla en CSS */
            src: url('fonts/RadwaveFont_Demo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b1122; 
            color: #E7E0C4; 
            font-family: 'Radwave', sans-serif; 
            display: flex;
            flex-direction: column; 
            min-height: 100vh;
        }
/* --- Nuevo Contenedor Principal --- */
        .contenido-principal {
            flex-grow: 1;           /* Absorbe el espacio vertical sobrante */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra verticalmente el bloque entero (Header + Emulador) */
            align-items: center;     /* Centra horizontalmente */
            gap: 15px;              /* ¡CONTROL CLAVE! Ajusta este valor para acercar/alejar el header del emulador */
            width: 100%;
        }
/* --- Encabezado --- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center; 
            width: 100%;
            z-index: 5;             /* Asegura que quede por encima de las franjas de fondo */
        }

        .logo-cp-container img {
            width: 120px; 
            height: auto;
        }

        .presentando-txt {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- Área Central de Presentación --- */
        .seccion-central {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; 
            overflow: hidden; 
            width: 100%;
            padding: 20px 0;        /* Espacio para que no se corte la sombra del emulador */
        }

        /* Las franjas retro usando tu imagen */
        .rainbow-stripes {
            position: absolute;
            width: 100%;
            height: 200px; 
            top: 50%;
            transform: translateY(-50%);
            
            background-image: url('images/lines.png'); 
            
            background-position: center; 
            background-repeat: no-repeat; 
            clip-path: polygon(100px 0, 100% 0, calc(100% - 100px) 100%, 0 100%);
        }

        /* Contenedor del emulador con el marco */
        .marco-dos-presentacion {
            width: 800px;
            height: 600px;
            max-width: 90vw; 
            max-height: calc(90vw * (600 / 800));
            
            border: 2px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            overflow: hidden;
            position: relative; 
            background-color: black;
        }

        #contenedor-dos {
            width: 100%;
            height: 100%;
        }

        /* --- Superposición de Texto Estático de MS-DOS --- */
        .dos-text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; 
            z-index: 10;
        }

        .dos-crt-dots {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
            background-size: 3px 3px;
            opacity: 0.3;
        }

        /* --- Pie de Página --- */
        footer {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 20px;
        }

        /* Logos (izquierda) */
        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px; 
        }

        .logo-footer img {
            width: 40px; 
            height: auto;
        }

        .footer-left h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            font-weight: bold;
        }

        /* Iconos de Redes Sociales (derecha) */
        .footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-icon img {
            width: 24px;
            height: auto;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .social-icon img:hover {
            opacity: 1;
        }

        /* --- Adaptabilidad (Responsive) --- */
        /*
        @media (max-width: 1700px) {
            .rainbow-stripes {
                width: 75% !important;
            }
        @media (max-width: 1100px) {
            .rainbow-stripes {
                width: 100% !important;
            }
            footer {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
        }
        */
    </style>
</head>
<body>

    <div class="contenido-principal">
        <header>
            <div class="logo-cp-container">
                <img src="images/LOGO flat.png" alt="Logo Checkpoint Central">
            </div>
            <span class="presentando-txt">PRESENTANDO:</span>
        </header>

        <main class="seccion-central">
            <div class="rainbow-stripes"></div>

            <div class="marco-dos-presentacion">
                <div id="contenedor-dos"></div>
                <div class="dos-text-overlay">
                    <div class="dos-crt-dots"></div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <div class="footer-left">
            <a href="https://cafecito.app/checkpointvg" target="_blank" class="social-icon"><img src="images/cafecito.png" alt="Cafecito"></a>
            <a href="https://ko-fi.com/checkpointvg" target="_blank" class="social-icon"><img src="images/kofi.png" alt="Kofi"></a>
            <div class="logo-footer"></div>
            <h2>CHECKPOINTVG</h2>
        </div>

        <div class="footer-right">
            <a href="https://www.twitch.tv/checkpointvg" target="_blank" class="social-icon"><img src="images/twitch.png" alt="Twitch"></a>
            <a href="https://www.youtube.com/checkpointvg" target="_blank" class="social-icon"><img src="images/youtube.png" alt="YouTube"></a>
            <a href="https://www.instagram.com/podcheckpoint/?hl=es-la" target="_blank" class="social-icon"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="https://discord.com/channels/445775995841150986/445775995841150989" target="_blank" class="social-icon"><img src="images/discord.png" alt="Discord"></a>
        </div>
    </footer>


    <script>
        window.addEventListener("load", async () => {
            if (typeof Dos === "undefined") {
                console.error("No se pudo cargar el motor JS-DOS.");
                return;
            }

            try {
                const ci = await Dos(document.getElementById("contenedor-dos"), {
                    url: "smenem.zip",
                    autoStart: true,
                    kiosk: true
                });
                
                console.log("¡VM de DOS iniciada automáticamente con éxito!");

            } catch (error) {
                console.error("Error crítico en la VM de DOS:", error);
            }
        });
    </script>

</body>
</html>
